    (function(){var s=localStorage.getItem('bagagedrager_theme');var d=s||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',d);})();
  </script>
  <style>
    :root,[data-theme="dark"]{--bg:#08090c;--bg-card:#111318;--border:rgba(255,255,255,0.07);--accent:#e6b520;}
    [data-theme="light"]{--bg:#f5f5f7;--bg-card:#ffffff;--border:rgba(15,18,25,0.09);--accent:#9a6b00;}
    body{background:var(--bg);margin:0;min-height:100vh;}
    #auth-screen,#app{display:none;}
    #app-loading{display:flex;align-items:center;justify-content:center;min-height:100vh;}
    .app-loader{width:36px;height:36px;border:3px solid rgba(128,128,128,0.15);border-top-color:var(--accent);border-radius:50%;animation:_spin .7s linear infinite;}
    @keyframes _spin{to{transform:rotate(360deg);}}
  </style>
  <!-- Async CSS: blokkeert first paint niet — kritieke styles staan hierboven inline.
       media="print" + onload-swap is de standaard async-CSS-truc; noscript als fallback.
       Bootstrap is verwijderd: style.css (sectie 1b) implementeert de gebruikte klassen zelf. -->
  <!-- Fonts self-hosted (Fontshare/ITF-licentie): geen CDN-roundtrip, werkt offline -->

    @font-face{font-family:'Clash Display';src:url('/fonts/clash-display-700.woff2') format('woff2');font-weight:700;font-display:swap;font-style:normal;}

<!-- Svelte 5-app: alle UI leeft in src/App.svelte en src/views/*.
     Dit bestand houdt alleen: inline kritieke CSS (head), fonts, thema-init,
     de tooltip-engine en het mount-punt. -->
<!-- Thema-init staat al in <head>; toggle-knop rendert App.svelte. -->
<script>
// Tooltip engine – uses fixed positioning so overflow:hidden can't clip it
(function() {
  let popup = null;
  function show(el) {
    if (!el.dataset.tip) return;
    if (!popup) { popup = document.createElement('div'); popup.className = 'tip-popup'; document.body.appendChild(popup); }
    popup.innerHTML = el.dataset.tip.replace(/\\n/g, '<br>');
    popup.classList.add('visible');
    const r = el.getBoundingClientRect();
    popup.style.left = Math.min(r.left, window.innerWidth - 280) + 'px';
    popup.style.top = (r.bottom + 8) + 'px';
  }
  function hide() { if (popup) popup.classList.remove('visible'); }
  function tip(e) { const el = e.target instanceof Element ? e.target.closest('.info-tooltip') : null; return el; }
  document.addEventListener('pointerenter', e => { const t = tip(e); if (t) show(t); }, true);
  document.addEventListener('pointerleave', e => { const t = tip(e); if (t) hide(); }, true);
  document.addEventListener('focusin', e => { const t = tip(e); if (t) show(t); });
  document.addEventListener('focusout', e => { const t = tip(e); if (t) hide(); });
})();
</script>
<div id="svelte-root"></div>
<script type="module" src="../src/main.ts"></script>
</body>
</html>
